name: Deploy documentation

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: brainapi-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Lumen-Labs/brainapi-docs'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://brainapi.lumen-labs.ai/docs

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run docs:check

      - name: Validate agent gateway contract
        run: npm run gateway:check

      - name: Validate public repository contents
        run: npm run public:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build production site
        run: npm run build

      - name: Authenticate to the production fleet
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515310961483:role/brainapi-maas-production-deploy
          aws-region: eu-central-1

      - name: Package the private runtime
        run: tar -czf brainapi-docs-release.tgz --exclude=.next/cache .next node_modules content public package.json package-lock.json ecosystem.config.js

      - name: Roll the AWS fleet
        run: |
          python3 -m venv "$RUNNER_TEMP/deploy-venv"
          "$RUNNER_TEMP/deploy-venv/bin/pip" install boto3
          "$RUNNER_TEMP/deploy-venv/bin/python" -m unittest discover -s scripts/operations -p test_deploy_aws.py
          "$RUNNER_TEMP/deploy-venv/bin/python" scripts/operations/deploy-aws.py --component docs \
            --archive brainapi-docs-release.tgz --release "docs-${GITHUB_SHA}-${GITHUB_RUN_ID}"
